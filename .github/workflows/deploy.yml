# .github/workflows/deploy.yml
name: CI/CD to Self-Hosted Server

on:
  push:
    branches:
      - master

permissions:
    contents: read
    packages: write

jobs:
  deploy:
    runs-on: self-hosted
   
    env:
      IMAGE_NAME: eris.mentor
      OWNER: ${{ github.repository_owner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $OWNER --password-stdin

      - name: Build and push Docker image
        run: |
          OWNER_LOWER=$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGE=ghcr.io/${OWNER_LOWER}/${IMAGE_NAME}:latest
          docker build -t $IMAGE .
          docker push $IMAGE

      - name: Pull new image and restart container
        working-directory: /home/runner/app
        run: |
          OWNER_LOWER=$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGE=ghcr.io/${OWNER_LOWER}/${IMAGE_NAME}:latest
          docker pull $IMAGE
          docker compose down || true
          docker compose up -d
