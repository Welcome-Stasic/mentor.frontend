name: CI/CD to Self-Hosted Server

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/12bsg12/eris.mentor:latest

jobs:
  build:
    name: Build and Push Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

      - name: Build and push image to GHCR
        run: |
          docker buildx build \
            --cache-from=type=local,src=/tmp/.buildx-cache \
            --cache-to=type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --push \
            -t $IMAGE .

      - name: Move build cache for next run
        run: |
          if [ -d /tmp/.buildx-cache-new ]; then
            rm -rf /tmp/.buildx-cache
            mv /tmp/.buildx-cache-new /tmp/.buildx-cache
          fi

  deploy:
    name: Deploy on Self-Hosted Runner
    runs-on: self-hosted
    needs: build

    steps:
      - name: Log in to GHCR on self-hosted runner
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

      - name: Pull new image and restart container
        working-directory: /home/runner/app
        run: |
          docker compose pull
          docker compose up -d --remove-orphans

      - name: Clean up unused Docker images and cache
        run: |
          echo "Cleaning up dangling images and build cache..."
          docker image prune -f
          docker builder prune -f
