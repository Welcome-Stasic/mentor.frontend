version: "3.9"

services:
  nextjs:
    build: .
    container_name: next-app
    expose:
      - 3000
    environment:
      - NODE_ENV=production

  nginx:
    image: nginx:stable-alpine
    container_name: next-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - nextjs
