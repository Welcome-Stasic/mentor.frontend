version: "3.9"

services:
  nextjs:
    image: ghcr.io/12bsg12/eris.mentor:latest  # будет обновляться из GHCR
    container_name: nextjs
    restart: always

  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - nextjs